# Builds and checks every PR and push; deploys pushes to master with the Cloudflare CLI (cf):
#   site Worker "our-moving-stories" (ourmovingstories.com) + Eventbrite sync Worker.
# There's no separate preview deployment: draft mode for Studio's Presentation tool runs on the live site,
# per request (web/src/sanity/lib/draft-mode.ts).
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Repository variables: SANITY_STUDIO_PROJECT_ID, SANITY_STUDIO_DATASET, and optionally
# PUBLIC_CF_WEB_ANALYTICS_TOKEN (Cloudflare Web Analytics; the beacon is left out when it's empty).
# Worker secrets (the site's SANITY_READ_TOKEN, the sync Worker's tokens) are uploaded once by hand with
# `cf deploy --secrets-file` (see docs/redesign/HANDOFF.md → Hosting); later deploys keep them.
name: Deploy

on:
  pull_request:
  push:
    branches: [master, develop]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
      SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
      PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bunx astro check
      - run: npx cf build
      - run: npx cf deploy --prebuilt --dry-run
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx cf deploy --prebuilt --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  eventbrite-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/eventbrite-sync
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: npx cf build
      - run: npx tsc --noEmit
      - run: npx cf deploy --prebuilt --mode production --dry-run
      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx cf deploy --prebuilt --mode production --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
